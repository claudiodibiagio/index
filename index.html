*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  background:radial-gradient(ellipse at 50% 0%,var(--bg2),var(--bg) 70%);
  color:var(--crema);min-height:100vh;overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;border:none}
.btn{
  background:linear-gradient(#c9a24d,#9a7529);color:#221703;border:1px solid #6d4f12;
  padding:9px 18px;border-radius:4px;font-size:15px;font-weight:600;letter-spacing:.02em;
  box-shadow:0 2px 0 #5c410d,var(--ombra);transition:.12s;
}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 #5c410d}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.btn.ghost{background:transparent;color:var(--oro);border:1px solid #6d5a2c;box-shadow:none}
.btn.ghost:hover{background:rgba(217,180,90,.12)}

/* ---------- CARTE ---------- */
.card{
  width:var(--cw);height:var(--ch);border-radius:5px;position:relative;flex:none;
  background-image:var(--sprite);background-size:1000% 400%;background-repeat:no-repeat;
  box-shadow:var(--ombra);border:1px solid #d8cfb8;background-color:#fff;
}
.card.back{
  background-image:
    repeating-linear-gradient(45deg,#7d2b26 0 6px,#8e332d 6px 12px),
    linear-gradient(#8e332d,#6d211d);
  background-size:auto;border-color:#e2d6b4;
}
.card.back::after{
  content:"";position:absolute;inset:6px;border:1px solid rgba(240,212,136,.55);border-radius:3px;
}
.card.sm{--ch:64px;--cw:34px;width:34px;height:64px}
.card.med{--ch:111px;--cw:58px;width:58px;height:111px}
.draftTre{display:flex;gap:22px;align-items:center;justify-content:center;flex-wrap:wrap}
.colMio{flex:none;display:flex;flex-direction:column;align-items:center;gap:10px;
  border:1px solid rgba(240,212,136,.16);border-radius:10px;padding:12px 14px}
.destra{display:flex;gap:34px;align-items:center;flex:none}
.filaEt.suo{width:calc(60px*3 + 5px*2);text-align:center}
.colSuo{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;
  border:1px solid rgba(240,212,136,.12);border-radius:10px;padding:12px}
.miaCar{flex:none;display:flex;flex-direction:column;gap:9px;min-width:0}
.filaCar{display:flex;gap:4px;flex-wrap:wrap;width:calc(58px*6 + 4px*5);min-height:111px;
  align-content:flex-start}
.filaCar.tre{width:calc(60px*3 + 5px*2);min-height:0;gap:5px}
.card.pic{--ch:115px;--cw:60px;width:60px;height:115px}
.filaEt.vuota{visibility:hidden}
.filaEt{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.5;margin-bottom:2px;
  width:calc(58px*6 + 4px*5);height:13px;line-height:13px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.colDraft{flex:none;display:flex;flex-direction:column;align-items:center}
.card.ace{box-shadow:0 0 0 2px var(--oro2),var(--ombra)}
.card.spenta{filter:grayscale(.7) brightness(.5)}

/* ---------- IMPIANTO A DUE COLONNE ---------- */
#app{display:grid;grid-template-columns:minmax(300px,0.80fr) minmax(0,1.20fr);
  gap:14px;height:100vh;padding:12px 14px;align-items:stretch;max-width:1700px;margin:0 auto}
#sinistra{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.pannello{border:1px solid rgba(240,212,136,.22);border-radius:12px;
  background:linear-gradient(rgba(255,255,255,.035),rgba(0,0,0,.12));
  padding:12px 14px;display:flex;flex-direction:column;align-items:center;gap:9px;min-width:0}
#zonaMano{flex:none;align-self:stretch}
#zonaLog{flex:1;min-height:0;align-items:stretch}
#zonaLog{flex:1;min-height:0;align-items:stretch}
.etichetta{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--oro);
  opacity:.72;text-align:center}
#centro{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;min-width:0;min-height:0}
.titolo{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--oro);opacity:.85}

/* ---------- IL TAVOLO ---------- */
.board{display:flex;align-items:center;justify-content:center;gap:clamp(8px,1.6vw,26px);
  background:radial-gradient(ellipse at 50% 50%,var(--felt2),var(--felt) 74%);
  border:2px solid #16281d;border-radius:14px;padding:14px 16px;
  box-shadow:inset 0 0 60px rgba(0,0,0,.5)}
.griglia{display:grid;grid-template-columns:repeat(5,var(--cw));
  justify-items:center;gap:8px 5px}
.slot{width:var(--cw);height:var(--ch);border-radius:5px;
  border:1px dashed rgba(240,212,136,.28);display:flex;align-items:center;justify-content:center;
  font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:rgba(240,212,136,.4);
  text-align:center;padding:3px;flex:none}
.slot.giuLab{align-items:flex-end}
.slot.suLab{align-items:flex-start}
.slot.attivo{border-color:var(--oro2);background:rgba(240,212,136,.13);cursor:pointer;
  box-shadow:0 0 14px rgba(240,212,136,.35)}
.pila{display:flex;flex-direction:column;align-items:center}
.pila>*{position:relative}
.pila.giu>*{margin-top:var(--sovr)}
.pila.giu>*:first-child{margin-top:0}
.pila.su{flex-direction:column-reverse}
.pila.su>*{margin-bottom:var(--sovr)}
.pila.su>*:first-child{margin-bottom:0}
.pila{--sovr:calc(var(--ch)*-0.74)}          /* i Giullari si accavallano molto */
.pila.duo{--sovr:calc(var(--ch)*-0.5)}       /* Cavaliere e Scudiero solo a metà */
.pila.duo>*:first-child{z-index:2}           /* il Cavaliere resta sopra, tutto visibile */
.assoBox{display:flex;flex-direction:column;align-items:center;gap:4px}
.tag{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;
  border-radius:9px;white-space:nowrap}
.tag.corr{background:var(--oro);color:#2b1e04}
.tag.nem{background:var(--rosso);color:#ffe9c8}
.tag.off{background:rgba(0,0,0,.3);color:rgba(242,234,215,.45)}

/* ---------- I PUNTEGGI, AI LATI DELLA MAPPA ---------- */
.punti{display:flex;flex-direction:column;align-items:center;gap:1px;flex:none}
.punti .chi{font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.65}
.punti b.pf{font-size:clamp(34px,5.6vh,58px);line-height:1;color:var(--oro2);
  font-variant-numeric:tabular-nums;text-shadow:0 3px 10px rgba(0,0,0,.5)}
.punti .sotto{font-size:9px;letter-spacing:.14em;text-transform:uppercase;opacity:.5;margin-bottom:7px}
.punti .mini{font-size:11px;opacity:.72}
.punti .mini b{color:var(--oro2);font-size:14px}
.punti.mio b.pf{color:#bfe6c6}

/* ---------- LA MANO ---------- */

<body>

<div id="app" hidden>
  <div id="sinistra">
    <section class="pannello" id="zonaMano">
      <div class="etichetta">La tua mano</div>
      <div id="mano"></div>
      <div class="hint" id="hint"></div>
      <div class="azioni" id="azioni"></div>
      <button class="btn ghost" id="vediScarti" hidden style="font-size:12px;padding:5px 12px"></button>
    </section>
    <section class="pannello" id="zonaLog">
      <div class="etichetta">Registro del viaggio</div>
      <div id="log"></div>
    </section>
  </div>
  <main id="centro">
    <div class="titolo" id="titoloGiostra"></div>
    <div class="board" id="board"></div>
    <div class="avviso" id="avviso"></div>
  </main>
</div>

<div class="ov" id="ov"><div class="panel" id="panel"></div></div>
<div class="ov" id="ovScarti" hidden><div class="panel" id="panelScarti"></div></div>
<div class="ov" id="ovEsci" hidden><div class="panel" id="panelEsci"></div></div>
<button id="abbandona" hidden>Abbandona la partita</button>

<script>
/* ==========================================================================
   1. MOTORE — logica pura, identica a engine.js
   ========================================================================== */
const SEMI=['D','S','C','B'];
const NOME_SEME={D:'Denari',S:'Spade',C:'Coppe',B:'Bastoni'};
const NOME_GIU={8:'La Staffetta',9:'Il Guastafeste',10:'Il Capocomico'};
const NOME_RUOLO={cavaliere:'Cavaliere',scudiero:'Scudiero',equipaggiamento:'Equipaggiamento',giullare:'Giullare'};
const PF_SCU=4, PF_CAV=6, BERSAGLIO=8;
const carta=(s,v)=>({s,v,id:s+v});
const isGiullare=c=>c.v>=8;
const nomeCarta=c=>(c.v>=8?NOME_GIU[c.v]:c.v)+' di '+NOME_SEME[c.s];

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}
function mischia(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];}return a;}
function mazzoCompleto(){const m=[];for(const s of SEMI)for(let v=2;v<=10;v++)m.push(carta(s,v));return m;}
function nuovoCampo(){return{cav:null,scu:null,equ:null,giullari:[]};}
function nuovoViandante(n){return{nome:n,carovana:[],mano:[],campo:nuovoCampo(),scarti:[],pf:0,passato:false};}

function nuovaPartita({seed=Date.now()&0xffff,primo=0,nomi=['Tu','Bot']}={}){
  const r=rng(seed), assi=mischia(SEMI.map(s=>carta(s,1)),r);
  return{rnd:r,mappa:assi.slice(0,3),assoScartato:assi[3],giostra:0,
    assoCorrente:null,assoNemico:null,v:[nuovoViandante(nomi[0]),nuovoViandante(nomi[1])],
    primoDraft:primo,turno:primo,fase:'draft',attesa:null,log:[]};
}
function creaDraft(g){
  const m=mischia(mazzoCompleto(),g.rnd);
  // 1. il mucchio: sei carte a testa, quattro scoperte e due coperte
  g.iniziali=[[],[]];
  for(const p of [0,1]){
    const sei=m.splice(0,6);
    const cop=mischia([0,1,2,3,4,5],g.rnd).slice(0,2);
    g.iniziali[p]=sei.map((c,k)=>({c,coperta:cop.includes(k)}));
    g.v[p].carovana.push(...sei);
  }
  // 2. due gruppi da dodici: riga alta scoperta, riga di mezzo coperta, riga bassa scoperta
  g.gruppi=[];
  for(let i=0;i<2;i++)
    g.gruppi.push(m.splice(0,12).map((c,k)=>({c,coperta:k>=4&&k<8,presa:null})));
  g.gruppoIdx=0;g.turno=g.primoDraft;
  return g;
}
function prendiInDraft(g,p,i){
  if(g.fase!=='draft')throw new Error('il draft è già concluso');
  const gr=g.gruppi[g.gruppoIdx];
  if(!gr)throw new Error('gruppo di draft non valido');
  const sl=gr[i];
  if(!sl||sl.presa!==null)throw new Error('carta non disponibile');
  sl.presa=p;g.v[p].carovana.push(sl.c);   // se era coperta resta coperta
  if(gr.every(s=>s.presa!==null)){
    g.gruppoIdx++;
    if(g.gruppoIdx>=2){for(const v of g.v)v.carovana=mischia(v.carovana,g.rnd);g.fase='pronti';}
    else g.turno=1-g.primoDraft;            // il secondo gruppo lo apre l'altro
  } else g.turno=1-g.turno;
  return g;
}
function iniziaGiostra(g){
  g.giostra++;const i=g.giostra-1;
  g.iC=i; g.iN=(i+1)%3;
  g.assoCorrente=g.mappa[g.iC];g.assoNemico=g.mappa[g.iN];
  for(const v of g.v){v.campo=nuovoCampo();v.passato=false;}
  g.attesa=null;
  for(const v of g.v)for(let k=0;k<5&&v.carovana.length;k++)v.mano.push(v.carovana.shift());
  g.turno=g.giostra%2===1?g.primoDraft:1-g.primoDraft;
  g.fase='conta';return g;
}
function conta(g,p,ids=[]){
  const v=g.v[p];
  for(const id of ids){const k=v.mano.findIndex(c=>c.id===id);
    if(k<0)throw new Error('carta non in mano');v.scarti.push(v.mano.splice(k,1)[0]);}
  if(v.mano.length>6)throw new Error('devi scendere a 6 carte');
  v.contaFatta=true;
  if(g.v.every(x=>x.contaFatta)){g.v.forEach(x=>x.contaFatta=false);g.fase='giostra';}
  return g;
}
function ruoliPossibili(campo,c){
  if(isGiullare(c))return['giullare'];
  const r=[];
  if(!campo.cav)r.push('cavaliere');
  if(!campo.scu)r.push('scudiero');
  if(!campo.equ&&campo.scu&&campo.cav)r.push('equipaggiamento');
  return r;
}
function mosseLegali(g,p){
  const v=g.v[p];if(v.passato)return[];
  const m=[];
  for(const c of v.mano)for(const r of ruoliPossibili(v.campo,c))m.push({tipo:'gioca',id:c.id,ruolo:r});
  m.push({tipo:'passa'});return m;
}
function bloccato(g,p){const v=g.v[p];
  return v.passato||v.mano.every(c=>ruoliPossibili(v.campo,c).length===0);}
function passaTurno(g,p){
  const a=1-p;
  if(bloccato(g,a)&&bloccato(g,p)){g.fase='applausi';return;}
  g.turno=bloccato(g,a)?p:a;
}
function gioca(g,p,id,ruolo,scelta){
  const v=g.v[p],av=g.v[1-p];
  if(g.fase!=='giostra')throw new Error('fase errata');
  if(g.turno!==p)throw new Error('non è il tuo turno');
  if(v.passato)throw new Error('hai già passato');
  const k=v.mano.findIndex(c=>c.id===id);if(k<0)throw new Error('carta non in mano');
  const c=v.mano[k];
  if(!ruoliPossibili(v.campo,c).includes(ruolo))throw new Error('ruolo non valido');
  v.mano.splice(k,1);
  const ev={carta:c,ruolo,pescata:null,eliminato:null};
  if(ruolo==='cavaliere')v.campo.cav=c;
  else if(ruolo==='scudiero')v.campo.scu=c;
  else if(ruolo==='equipaggiamento')v.campo.equ=c;
  else{
    v.campo.giullari.push(c);
    if(c.v===9&&av.campo.scu){ev.eliminato=av.campo.scu;av.scarti.push(av.campo.scu);av.campo.scu=null;}
    if(c.v===8){
      // LA STAFFETTA: pescare dalla Carovana oppure scartare una carta dalla mano
      if(scelta){ applicaStaffetta(g,p,scelta,ev); }
      else if(v.mano.length){ g.attesa={p,ev}; return ev; }   // c'è una scelta da fare
      else if(v.carovana.length){ applicaStaffetta(g,p,{tipo:'pesca'},ev); }
    }
  }
  passaTurno(g,p);return ev;
}
/** Risolve la scelta della Staffetta: 'pesca', 'scarta' (con id) o 'niente'. */
function applicaStaffetta(g,p,scelta,ev){
  const v=g.v[p];
  if(scelta.tipo==='scarta'){
    const k=v.mano.findIndex(c=>c.id===scelta.id);
    if(k>=0){ev.scartata=v.mano.splice(k,1)[0];v.scarti.push(ev.scartata);}
  } else if(scelta.tipo==='pesca'&&v.carovana.length){
    ev.pescata=v.carovana.shift();v.mano.push(ev.pescata);
  }
  return ev;
}
function risolviStaffetta(g,scelta){
  if(!g.attesa)return null;
  const {p,ev}=g.attesa; g.attesa=null;
  applicaStaffetta(g,p,scelta,ev);
  passaTurno(g,p);
  return ev;
}

function passa(g,p){
  if(g.turno!==p)throw new Error('non è il tuo turno');
  g.v[p].passato=true;passaTurno(g,p);return g;
}
function valoreScudiero(k){if(!k.scu)return null;
  const b=k.cav&&k.cav.s===k.scu.s?2:0;return{tot:k.scu.v+b,base:k.scu.v,bonus:b};}
function valoreCavaliere(k,ac){if(!k.cav)return null;
  const ba=k.cav.s===ac.s?1:0,eq=k.equ?k.equ.v:0,tot=k.cav.v+ba+eq;
  return{tot,base:k.cav.v,bonusAsso:ba,equip:eq,dist:Math.abs(BERSAGLIO-tot)};}
function carteDelSeme(k,s){let n=0;
  for(const c of[k.cav,k.scu,k.equ])if(c&&c.s===s)n++;
  for(const c of k.giullari)if(c.s===s)n++;return n;}
function istrione(k,an){
  const G=k.giullari.length,d=k.giullari.filter(c=>c.v===10).length;
  const capo=G>0?d*(G-1):0, nem=k.giullari.filter(c=>c.s===an.s).length;
  return{tot:capo+nem,capocomico:capo,nemici:nem,dieci:d,giullari:G};
}
function applausi(g){
  const[A,B]=g.v,ac=g.assoCorrente,an=g.assoNemico;
  const R={pf:[0,0],mano:[0,0]};
  const sA=valoreScudiero(A.campo),sB=valoreScudiero(B.campo);
  let vS=null;
  if(sA&&sB)vS=sA.tot>sB.tot?0:sB.tot>sA.tot?1:null;else if(sA)vS=0;else if(sB)vS=1;
  if(vS!==null)R.pf[vS]+=PF_SCU;
  R.scudieri={a:sA,b:sB,vincitore:vS};
  const cA=valoreCavaliere(A.campo,ac),cB=valoreCavaliere(B.campo,ac);
  let vC=null,sp=null;
  if(cA&&cB){
    if(cA.dist<cB.dist)vC=0;else if(cB.dist<cA.dist)vC=1;
    else{const nA=carteDelSeme(A.campo,ac.s),nB=carteDelSeme(B.campo,ac.s);
      sp={a:nA,b:nB};vC=nA>nB?0:nB>nA?1:null;}
  }else if(cA)vC=0;else if(cB)vC=1;
  if(vC!==null)R.pf[vC]+=PF_CAV;
  R.cavalieri={a:cA,b:cB,vincitore:vC,spareggio:sp};
  const iA=istrione(A.campo,an),iB=istrione(B.campo,an);
  R.istrione={a:iA,b:iB};R.pf[0]+=iA.tot;R.pf[1]+=iB.tot;
  if(g.giostra===3){R.mano=[A.mano.length,B.mano.length];
    R.pf[0]-=R.mano[0];R.pf[1]-=R.mano[1];}
  A.pf+=R.pf[0];B.pf+=R.pf[1];
  g.ultimoCalcolo=R;g.fase=g.giostra===3?'fine':'intergiostra';
  return R;
}
function chiudiGiostra(g){
  for(const v of g.v){
    for(const c of[v.campo.cav,v.campo.scu,v.campo.equ])if(c)v.scarti.push(c);
    v.scarti.push(...v.campo.giullari);v.campo=nuovoCampo();
  }return g;
}

/* ==========================================================================
   2. IL BOT — draft e gioco, senza guardare le carte coperte
   ========================================================================== */
const BOT=1, ME=0;

/* --- Valutazione di draft ------------------------------------------------
   Tarata sui dati: servono 9 carte dal 2 al 7 (Cavaliere, Scudiero ed
   Equipaggiamento per tre giostre) e non una di più. Tutto il resto della
   Carovana rende di più se è fatto di figure, che però sono solo 12 in tutto:
   il draft è una rissa per una risorsa che non basta per due.
------------------------------------------------------------------------- */
const BASSE_NECESSARIE = 9;

function valoreDraft(c,carovana,livello){
  const W=PROFILI[livello]||PROFILI.cavaliere;
  if(!c) return 3.6;                              // coperta: se ne prende circa metà
  const basse=carovana.filter(x=>!isGiullare(x)).length;
  const giu=carovana.filter(isGiullare).length;

  if(isGiullare(c)){
    let s;
    if(W.obiettivo){                              // il Cavaliere si ferma alla sua quota
      const ho=carovana.filter(x=>x.v===c.v).length, voglio=W.obiettivo[c.v];
      s = ho<voglio ? 9.5+(voglio-ho)*1.2 : 3.0;
      if(giu>=6) s*=0.45;                         // sei figure gli bastano
    } else {                                      // il Buffone ne vuole quante può
      s = (W.pref[c.v]||1)*(7.5+Math.min(giu,6)*0.7);
    }
    return s*W.giu;
  }

  let v = 2.4 + (c.v===7?0.6:0);
  v += Math.min(carovana.filter(x=>x.s===c.s&&!isGiullare(x)).length,3)*0.5;   // blocchi di seme
  v += Math.min(carovana.filter(x=>!isGiullare(x)&&x.v+c.v===8).length,2)*0.7; // coppie che fanno 8
  if(basse>=(W.obiettivo?12:9)) v*=0.45;          // oltre il necessario rendono poco
  return v*W.duello;
}

function botDraft(g,livello){
  const gr=g.gruppi[g.gruppoIdx], car=g.v[BOT].carovana;
  const rum=(PROFILI[livello]||PROFILI.cavaliere).rumore*0.4;
  let best=-1,bs=-Infinity;
  gr.forEach((sl,i)=>{
    if(sl.presa!==null)return;
    const s=valoreDraft(sl.coperta?null:sl.c,car,livello)+g.rnd()*rum;
    if(s>bs){bs=s;best=i;}
  });
  return best;
}

/* --- Valutazione di gioco ------------------------------------------------
   Ogni livello ha un profilo strategico diverso, non solo più rumore.
   attesa : quanto capisce che lo Scudiero va calato tardi
   combo  : quanto capisce che il 10 da solo vale zero
   tempi  : quanto aspetta col Guastafeste che ci sia uno Scudiero da colpire
   mira   : quanto ottimizza il Cavaliere verso l'8
------------------------------------------------------------------------- */
const PROFILI={
  // Un solo avversario: equilibrato. Punta a sei figure, due per tipo,
  // e cerca di fare il meglio su tutti e tre i fronti.
  cavaliere:{attesa:1,combo:1,tempi:1,mira:1, draft:1, rumore:0.9,
             obiettivo:{8:2,9:2,10:2}, duello:1.05, giu:1.05}
};
function potenzialeGiullari(v){
  return v.campo.giullari.length + v.mano.filter(isGiullare).length;
}
/** Il miglior Cavaliere (con eventuale equipaggiamento) ottenibile dalla mano. */
function miglioreCavaliere(mano,ac){
  const basse=mano.filter(c=>!isGiullare(c));
  let best=null;
  for(const cav of basse){
    const b=cav.s===ac.s?1:0;
    let d=Math.abs(BERSAGLIO-(cav.v+b));
    if(!best||d<best.dist)best={cav,equ:null,dist:d,tot:cav.v+b};
    for(const eq of basse){
      if(eq.id===cav.id)continue;
      const t=cav.v+b+eq.v,dd=Math.abs(BERSAGLIO-t);
      if(dd<best.dist)best={cav,equ:eq,dist:dd,tot:t};
    }
  }
  return best;
}

function botMossa(g,livello){
  const W=PROFILI[livello]||PROFILI.cavaliere;
  const v=g.v[BOT],av=g.v[ME],ac=g.assoCorrente,an=g.assoNemico;
  const legali=mosseLegali(g,BOT);
  if(legali.length<=1)return{tipo:'passa'};
  const mano=v.mano, ultimo=g.giostra===3;
  const avvFinito = av.passato || av.mano.length===0;
  const piano = miglioreCavaliere(mano,ac);

  const punteggio=m=>{
    if(m.tipo==='passa'){
      let s=0.5;
      if(ultimo) s-=mano.length*2.2;
      if(!v.campo.cav && piano) s-=7;
      if(!v.campo.scu && mano.some(c=>!isGiullare(c))) s-=3.2;
      if(mano.some(c=>c.v===10) && potenzialeGiullari(v)>1) s-=5;
      if(mano.some(c=>c.v===8)) s-=2.5;
      if(mano.some(c=>c.v===9) && av.campo.scu) s-=6;
      return s;
    }
    const c=mano.find(x=>x.id===m.id);

    if(m.ruolo==='giullare'){ const _g=W.giu;
      if(c.v===10){
        const altri=potenzialeGiullari(v)-1;
        // senza "combo" il bot crede che un 10 valga sempre: lo cala e basta
        const consapevole = altri>=1 ? 5.5+altri*1.5 : (c.s===an.s?2.2:-2.5);
        const ingenuo = 6.5;
        let s = ingenuo + (consapevole-ingenuo)*W.combo;
        if(c.s===an.s)s+=1.6;
        if(ultimo&&altri===0&&c.s!==an.s)s=Math.min(s,0.4+2*(1-W.combo));
        return s;
      }
      if(c.v===8){
        let s=4.4;
        if(v.carovana.length===0)s-=2.2;
        if(c.s===an.s)s+=1.5;
        if(mano.some(x=>x.v===10)||v.campo.giullari.some(x=>x.v===10))s+=1.4*W.combo;
        // la Staffetta è anche una valvola: se c'è da ripulire si usa subito,
        // altrimenti conviene tenerne una di riserva
        const morte=mano.filter(x=>!isGiullare(x)&&!ruoliPossibili(v.campo,x).length).length;
        if(morte)s+=3.2*W.combo;
        else if(!ultimo)s-=2.0*W.combo;
        return s*_g;
      }
      // il 9
      let s;
      if(av.campo.scu) s=9.5;
      else{
        const consapevole = avvFinito ? (c.s===an.s?2.6:0.9) : -1.5;
        const ingenuo = 5.5;                       // il bot facile lo spara subito
        s = ingenuo + (consapevole-ingenuo)*W.tempi;
        if(c.s===an.s)s+=1.4;
        if(ultimo)s+=2.2;
      }
      if(v.campo.giullari.some(x=>x.v===10)||mano.some(x=>x.v===10))s+=1.2*W.combo;
      return s*_g;
    }

    if(m.ruolo==='cavaliere'){ const _d=W.duello;
      if(!piano)return 0;
      const b=c.s===ac.s?1:0, d=Math.abs(BERSAGLIO-(c.v+b));
      // senza "mira" il bot guarda il valore nudo invece della distanza dall'8
      let s = 7 - d*1.25*W.mira + c.v*0.5*(1-W.mira);
      if(piano.cav.id===c.id) s+=2.2*W.mira;
      if(piano.equ&&piano.cav.id===c.id) s+=1.1*W.mira;
      if(b) s+=1.3;
      return s*_d;
    }

    if(m.ruolo==='scudiero'){ const _d=W.duello;
      // il cuore del gioco: aspettare che l'avversario non possa più giocare il 9
      const rischio = avvFinito ? 0 : (1+av.mano.length*0.85)*W.attesa;
      const val = c.v + (v.campo.cav&&v.campo.cav.s===c.s?2:0);
      let s = 3 + val*0.55 - rischio*1.35;
      if(v.campo.cav&&v.campo.cav.s===c.s) s+=1.8;
      if(!v.campo.cav&&piano&&piano.cav.id===c.id) s-=4*W.mira;
      if(avvFinito) s+=3.5*W.attesa;
      if(ultimo) s+=1.2;
      return s*_d;
    }

    if(m.ruolo==='equipaggiamento'){ const _d=W.duello;
      const cav=v.campo.cav,b=cav.s===ac.s?1:0;
      const prima=Math.abs(BERSAGLIO-(cav.v+b)), dopo=Math.abs(BERSAGLIO-(cav.v+b+c.v));
      let s = 3 + (prima-dopo)*2.6*W.mira;
      if(dopo===0)s+=3*W.mira;
      if(dopo>prima)s-=6*W.mira;
      return s*_d;
    }
    return 0;
  };

  let best=null,bs=-Infinity;
  for(const m of legali){
    const s=punteggio(m)+g.rnd()*W.rumore;
    if(s>bs){bs=s;best=m;}
  }
  return best;
}

/** La scelta della Staffetta per il bot: pescare o scartare, mai nessuna delle due. */
function sceltaStaffettaBot(g,p,livello){
  const W=PROFILI[livello]||PROFILI.cavaliere;
  const v=g.v[p], ultimo=g.giostra===3, ac=g.assoCorrente, an=g.assoNemico;
  if(!v.mano.length) return {tipo:'pesca'};
  const peso=c=>{
    if(c.v===10)return 30; if(c.v===8)return 26; if(c.v===9)return 22;
    if(!ruoliPossibili(v.campo,c).length)return -99;     // non ha più uno slot dove andare
    let x=5-Math.abs(BERSAGLIO-(c.v+(c.s===ac.s?1:0)))*0.5;
    if(c.s===ac.s)x+=2; if(c.s===an.s)x+=0.4; return x;
  };
  const peggiore=v.mano.slice().sort((x,y)=>peso(x)-peso(y))[0];
  if(!v.carovana.length) return {tipo:'scarta',id:peggiore.id};   // obbligato
  if(W.combo<0.3) return {tipo:'pesca'};                          // il principiante pesca e basta
  if(peso(peggiore)===-99) return {tipo:'scarta',id:peggiore.id};
  const basse=v.mano.filter(c=>!isGiullare(c));
  const residui=(!v.campo.cav?1:0)+(!v.campo.scu?1:0)+(!v.campo.equ?1:0);
  const soglia=ultimo?residui:residui+1;                          // una la posso riportare
  if(basse.length>soglia){
    const pb=basse.slice().sort((x,y)=>peso(x)-peso(y))[0];
    if(pb)return {tipo:'scarta',id:pb.id};
  }
  return {tipo:'pesca'};
}

/** LA CONTA del bot: scarta le carte meno utili. */
function botConta(g,livello){
  const W=PROFILI[livello]||PROFILI.cavaliere;
  const v=g.v[BOT],ac=g.assoCorrente,an=g.assoNemico;
  const extra=v.mano.length-6;
  if(extra<=0)return[];
  const peso=c=>{
    if(c.v===10)return 20+v.mano.filter(isGiullare).length*W.combo;
    if(c.v===8)return 15;
    if(c.v===9)return 12;
    let p=5-Math.abs(BERSAGLIO-(c.v+(c.s===ac.s?1:0)))*0.5*W.mira+c.v*0.3*(1-W.mira);
    if(c.s===ac.s)p+=2;
    if(c.s===an.s)p+=0.4;
    return p;
  };
  return v.mano.slice().sort((a,b)=>peso(a)-peso(b)).slice(0,extra).map(c=>c.id);
}

function inviaAzione(a){
  if(!RETE||RETE.ws.readyState!==1)return false;
  RETE.ws.send(JSON.stringify({t:'azione',a}));
  return true;
}
function codiceACaso(){
  const L='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from({length:4},()=>L[Math.floor(Math.random()*L.length)]).join('');
}
function collega(codice,token){
  $('abbandona').hidden=false;$('abbandona').onclick=chiediUscita;
  codice=codice.toUpperCase().replace(/[^A-Z0-9]/g,'');
  const url=SERVER.replace(/^http/,'ws')+'/ws?codice='+encodeURIComponent(codice)
    +(token?'&token='+encodeURIComponent(token):'');
  let ws;
  try{ ws=new WebSocket(url); }catch(e){ return salaErrore('Indirizzo del server non valido.'); }
  RETE={ws,codice,token:token||null,p:null};
  G=null;
  salaAttesa(codice,'Collegamento in corso…');
  ws.onopen=()=>salaAttesa(codice,'In attesa dell\'altro viandante…');
  ws.onmessage=ev=>{
    let m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
    if(m.t==='posto'){
      RETE.p=m.p; RETE.token=m.token;
      location.hash='c='+codice+'&t='+m.token;      // così ricaricando rientri
    }
    else if(m.t==='attesa') salaAttesa(codice,'In attesa dell\'altro viandante…');
    else if(m.t==='stato')  mostraStato(m.v,m.R,m.collegati);
    else if(m.t==='pieno')  salaErrore('Questa partita è già al completo.');
    else if(m.t==='errore') scrivi(m.m,'sys');
  };
  ws.onclose=()=>{ if(RETE&&RETE.ws===ws) salaErrore('Collegamento interrotto.'); };
  ws.onerror=()=>salaErrore('Non riesco a raggiungere il server.');
}
function salaAttesa(codice,msg){
  ov.hidden=false;ov.classList.remove('laterale');panel.className='panel';
  panel.innerHTML=`
    <h2>Partita <span style="letter-spacing:.28em;color:var(--oro2)">${codice}</span></h2>
    <p>${msg}</p>

    <b style="letter-spacing:.22em;color:var(--oro2)">${codice}</b>, oppure direttamente questo indirizzo:</p>
    <p style="font-size:12px;word-break:break-all;opacity:.6">${location.origin+location.pathname}#c=${codice}</p>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn ghost" id="annulla">Torna indietro</button>
    </div>`;
  $('annulla').onclick=()=>{try{RETE.ws.close()}catch(e){};RETE=null;location.hash='';schermataIniziale();};
}
function salaErrore(msg){
  RETE=null;
  ov.hidden=false;ov.classList.remove('laterale');panel.className='panel';

/** Arriva una vista dal server: la si disegna e basta, senza calcolare nulla. */
function mostraStato(v,R,collegati){
  G=v;
  if(G.fase==='draft'){ ultimaScelta=G.ultima||null; return schermataDraft(); }
  if(G.fase==='pronti') return schermataPartenza();

  if(G.fase==='conta'&&!G.v[ME].contaFatta&&G.v[ME].mano.length<=6) inviaAzione({t:'conta',ids:[]});
  disegna();
  if(collegati<2) scrivi('L\'altro viandante si è disconnesso: aspetto che rientri.','sys');
}

function mucchioMio(car,mie,dove){
  if(ordineCrescente){
    // stesse tre file, stessa altezza: cambia solo l'ordine delle carte
    const t=car.slice().sort((a,b)=>a.v-b.v||SEMI.indexOf(a.s)-SEMI.indexOf(b.s));
    dove.appendChild(filaCarte(t.slice(0,6),'Il tuo mucchio'));
    dove.appendChild(filaCarte(t.slice(6,12),'—',true));
    dove.appendChild(filaCarte(t.slice(12,18),'—',true));
    return;
  }
  const idIniz=new Set(mie.map(x=>x.c.id));
  const resto=car.filter(c=>!idIniz.has(c.id));
  const w=el('div');
  w.appendChild(el('div','filaEt','Il tuo mucchio'));
  const f=el('div','filaCar');
  mie.forEach(x=>{
    const e=x.coperta?cardSbirciabile(x.c):cardEl(x.c,{});
    e.classList.add('med'); f.appendChild(e);});
  w.appendChild(f); dove.appendChild(w);
  dove.appendChild(filaCarte(resto.slice(0,6),'Prima mano di draft'));
  dove.appendChild(filaCarte(resto.slice(6,12),'Seconda mano di draft'));
}

function nomiSlot(){
  // colonne della griglia: 0..4. Gli assi stanno in 1,2,3.
  const iC=G.iC, iN=G.iN;
  const colC=iC+1, colN=iN+1;
  const colE=colN>colC?colC-1:colC+1;   // equipaggiamento dal lato opposto ai giullari
  return{colC,colN,colE,iC,iN};
}

function bloccoPunti(p){

}

/** Dimensiona carte e mano sullo spazio realmente disponibile. */
function adatta(){
  const c=$('centro'), z=$('zonaMano'), s=$('sinistra');
  if(!c||!c.clientWidth||!G)return;
  const R=document.documentElement.style;

  // il semicampo è alto quanto la pila più lunga: Cavaliere+Scudiero sono 1.5 carte
  const maxG=Math.max(1,G.v[0].campo.giullari.length,G.v[1].campo.giullari.length);
  const altLato=Math.max(1.5, 1+(maxG-1)*0.26);
  const perAltezza=(c.clientHeight-150)/(2*altLato+1.15);
  const perLarghezza=(c.clientWidth-2*106-2*26-40)/5/0.524;
  // la riga di avviso occupa spazio sotto al tavolo
  
  const ch=Math.max(54,Math.min(210,Math.floor(Math.min(perAltezza,perLarghezza))));
  R.setProperty('--ch',ch+'px');

  // la mano è sempre tarata su cinque carte in fila; da sei in su si accavallano
  const n=Math.max(1,G.v[ME].mano.length);
  const wDisp=Math.max(120,z.clientWidth-30);
  const hDisp=Math.max(90,s.clientHeight*0.62-92);
  let cwm=Math.floor(Math.min((wDisp-32)/5, hDisp/1.905));
  cwm=Math.max(40,Math.min(cwm,160));
  R.setProperty('--cwm',cwm+'px');
  R.setProperty('--chm',Math.round(cwm*1.905)+'px');
  const serve=n*cwm+(n-1)*8;
  R.setProperty('--sovrm', (n>1&&serve>wDisp) ? '-'+Math.ceil((serve-wDisp)/(n-1))+'px' : '8px');
}

/* --- IL DIARIO: resoconto delle partite contro il Bot ------------------- */
let DIARIO=null;
function diarioNuovo(){ if(!RETE)DIARIO={inizio:Date.now(),giostre:[],mosse:[]}; }
function diarioGiostra(){
  if(!DIARIO)return;
  DIARIO.g={corrente:G.assoCorrente.s,nemico:G.assoNemico.s,
    mosse:[],eliminati:0,staffPesca:0,staffScarta:0};
  DIARIO.giostre.push(DIARIO.g);
}
function diarioMossa(t){ if(DIARIO&&DIARIO.g)DIARIO.g.mosse.push(t); }
function diarioApplausi(R){
  if(!DIARIO||!DIARIO.g)return;
  const d=DIARIO.g;
  d.campi=[ME,BOT].map(i=>{const k=G.v[i].campo;
    return {cav:k.cav?k.cav.id:null,scu:k.scu?k.scu.id:null,
      equ:k.equ?k.equ.id:null,giullari:k.giullari.map(c=>c.id)};});
  d.punti=[
    {scu:R.scudieri.vincitore===0?PF_SCU:0,cav:R.cavalieri.vincitore===0?PF_CAV:0,istr:R.istrione.a.tot},
    {scu:R.scudieri.vincitore===1?PF_SCU:0,cav:R.cavalieri.vincitore===1?PF_CAV:0,istr:R.istrione.b.tot}];
  d.vincitori={scu:R.scudieri.vincitore,cav:R.cavalieri.vincitore};
  d.spareggio=!!R.cavalieri.spareggio;
  d.perfetti=[R.cavalieri.a,R.cavalieri.b].filter(c=>c&&c.dist===0).length;
}
function archivia(){
  if(!DIARIO||RETE)return;
  const comp=v=>({s8:v.filter(c=>c.v===8).length,s9:v.filter(c=>c.v===9).length,
    s10:v.filter(c=>c.v===10).length,basse:v.filter(c=>c.v<8).length});
  const tutte=i=>[...G.v[i].carovana,...G.v[i].mano,...G.v[i].scarti,
    ...[G.v[i].campo.cav,G.v[i].campo.scu,G.v[i].campo.equ].filter(Boolean),
    ...G.v[i].campo.giullari];
  const res={v:1,tipo:'bot',draft:MODO,fine:Date.now(),
    durata:Math.round((Date.now()-DIARIO.inizio)/1000),
    mappa:G.mappa.map(a=>a.s),
    viandanti:[ME,BOT].map(i=>{const t=tutte(i);
      return {carovana:t.map(c=>c.id),comp:comp(t),
        mucchio:(G.iniziali&&G.iniziali[i]||[]).map(x=>x.c.id),
        pf:G.v[i].pf,manoFine:G.v[i].mano.length};}),
    giostre:DIARIO.giostre, mosse:DIARIO.mosse};
  DIARIO=null;
  fetch(SERVER+'/archivio',{method:'POST',
    body:JSON.stringify(res)}).catch(()=>{});
}

function disegna(){
  adatta();
  const b=$('board');b.innerHTML='';
  const{colC,colN,colE}=nomiSlot();
  const attesaMia = !!(G.attesa&&G.attesa.p===ME);
  const mioTurno = G.fase==='giostra'&&G.turno===ME&&!G.v[ME].passato&&!attesaMia;
  const fine = G.fase==='applausi'||G.fase==='intergiostra'||G.fase==='fine';
  const campoBot=G.v[BOT].campo, campoMe=G.v[ME].campo;

  b.appendChild(bloccoPunti(ME));
  const g=el('div','griglia');
  const put=(riga,col,node,all)=>{node.style.gridRow=riga;node.style.gridColumn=col+1;
    if(all)node.style.alignSelf=all;g.appendChild(node);};
  const slotMio=(ruolo,etich,extra)=>{
    const s=el('div','slot'+(extra?' '+extra:''),etich);
    if(mioTurno&&selId){
      const c=G.v[ME].mano.find(x=>x.id===selId);
      if(c&&ruoliPossibili(campoMe,c).includes(ruolo)){
        s.classList.add('attivo');s.onclick=()=>giocaIo(selId,ruolo);
      }
    }
    return s;
  };

  /* --- riga 1: il bot. Il Cavaliere è sopra allo Scudiero e resta scoperto per intero --- */
  const duoBot=el('div','pila su duo');
  duoBot.appendChild(campoBot.cav?cardEl(campoBot.cav,{coperta:!fine}):el('div','slot','Cavaliere'));
  duoBot.appendChild(campoBot.scu?cardEl(campoBot.scu,{coperta:!fine}):el('div','slot suLab','Scudiero'));
  put(1,colC,duoBot);
  put(1,colE, campoBot.equ?cardEl(campoBot.equ,{coperta:!fine}):el('div','slot','Equip.'),'end');
  const gBot=el('div','pila su');
  campoBot.giullari.forEach(c=>gBot.appendChild(cardEl(c)));
  if(!campoBot.giullari.length)gBot.appendChild(el('div','slot','Giullari'));
  put(1,colN,gBot,'end');

  /* --- riga 2: la Mappa del Regno --- */
  for(let idx=0;idx<3;idx++){
    const a=G.mappa[idx];
    const attivo = idx===G.iC||idx===G.iN;
    const box=el('div','assoBox');
    box.appendChild(cardEl(a,{coperta:!attivo,ace:attivo}));
    const t = idx===G.iC?['corr','Corrente']
      : idx===G.iN?['nem','Nemico'] : ['off','Lontano'];
    box.appendChild(el('span','tag '+t[0],t[1]));
    put(2,idx+1,box);
  }

  /* --- riga 3: tu --- */
  const duoMe=el('div','pila giu duo');
  duoMe.appendChild(campoMe.cav?(fine?cardEl(campoMe.cav):cardSbirciabile(campoMe.cav)):slotMio('cavaliere','Cavaliere'));
  duoMe.appendChild(campoMe.scu?(fine?cardEl(campoMe.scu):cardSbirciabile(campoMe.scu)):slotMio('scudiero','Scudiero','giuLab'));
  put(3,colC,duoMe);
  put(3,colE, campoMe.equ?(fine?cardEl(campoMe.equ):cardSbirciabile(campoMe.equ)):slotMio('equipaggiamento','Equip.'),'start');
  const gMe=el('div','pila giu');
  campoMe.giullari.forEach(c=>gMe.appendChild(cardEl(c)));
  if(!campoMe.giullari.length)gMe.appendChild(slotMio('giullare','Giullari'));
  put(3,colN,gMe,'start');

  b.appendChild(g);
  b.appendChild(bloccoPunti(BOT));
  disegnaMano();
  aggiornaHud();
}

function aggiornaHud(){
  $('titoloGiostra').textContent = G.giostra
    ? `Giostra ${G.giostra} di 3 — Castello di ${NOME_SEME[G.assoCorrente.s]}` : '';
}

function disegnaMano(){
  const m=$('mano');m.innerHTML='';
  const az=$('azioni');az.innerHTML='';
  const v=G.v[ME];
  const bs=$('vediScarti');
  if(bs){
    const n=(v.scarti||[]).length;
    bs.hidden = !(G.fase==='conta'||G.fase==='giostra'||G.fase==='intergiostra'||G.fase==='fine');
    bs.textContent=`I tuoi scarti · ${n}`;
    bs.onclick=mostraScarti;
  }
  const inConta = G.fase==='conta';
  const attesaMia = !!(G.attesa&&G.attesa.p===ME);
  const mioTurno = G.fase==='giostra'&&G.turno===ME&&!v.passato&&!attesaMia;

  v.mano.forEach(c=>{
    const e=cardEl(c);
    const ruoli=ruoliPossibili(v.campo,c);
    if(attesaMia&&(inScarto||!v.carovana.length)){
      e.classList.add('sceglibile');
      e.onclick=()=>risolviMia({tipo:'scarta',id:c.id});
    } else if(attesaMia){
      e.classList.add('morta');
    } else if(inConta){
      if(scartiConta.includes(c.id))e.classList.add('sel');
      e.onclick=()=>{
        const i=scartiConta.indexOf(c.id);
        i<0?scartiConta.push(c.id):scartiConta.splice(i,1);
        disegnaMano();
      };
    } else if(mioTurno){
      if(!ruoli.length){e.classList.add('morta');e.title=nomeCarta(c)+' — nessuno spazio libero';}
      else{
        if(selId===c.id)e.classList.add('sel');
        e.onclick=()=>{
          if(ruoli.length===1&&ruoli[0]==='giullare')return giocaIo(c.id,'giullare');
          selId = selId===c.id?null:c.id;
          disegna();
        };
      }
    } else e.classList.add('morta');
    m.appendChild(e);
  });

  if(inConta){
    const da=v.mano.length-6;
    $('hint').textContent=da>0
      ? `La Conta: devi scendere a 6 carte. Selezionane ${da-scartiConta.length>0?da-scartiConta.length:0} da scartare.`
      : 'La Conta: nessuno scarto necessario.';
    const b=el('button','btn','Conferma la Conta');
    b.disabled = scartiConta.length!==Math.max(0,da);
    b.onclick=()=>{
      if(RETE){ inviaAzione({t:'conta',ids:scartiConta}); scartiConta=[]; return; }
      conta(G,ME,scartiConta);
      if(scartiConta.length)scrivi(`Alla Conta scarti ${scartiConta.length} carta/e.`,'me');
      scartiConta=[];disegna();
      if(G.turno===BOT)setTimeout(turnoBot,650);
    };
    az.appendChild(b);
    return;
  }

  if(attesaMia){
    const deveScartare = !v.carovana.length;      // non potendo pescare, lo scarto è obbligato
    if(inScarto||deveScartare){
      $('hint').textContent = deveScartare
        ? 'La Carovana è vuota: la Staffetta ti obbliga a scartare. Scegli quale carta.'
        : 'La Staffetta: scegli quale carta scartare.';
      if(!deveScartare){
        const a=el('button','btn ghost','Torna indietro');
        a.onclick=()=>{inScarto=false;disegna();};
        az.appendChild(a);
      }
    } else {
      $('hint').textContent='La Staffetta: pesca dalla Carovana, oppure scarta una carta dalla mano.';
      const b1=el('button','btn',`Pesca · ${v.carovana.length}`);
      b1.onclick=()=>risolviMia({tipo:'pesca'});
      az.appendChild(b1);
      const b2=el('button','btn ghost','Scarta una carta');
      b2.onclick=()=>{inScarto=true;disegna();};
      az.appendChild(b2);
    }
    return;
  }

  if(G.fase!=='giostra'){$('hint').textContent='';return;}

  if(v.passato){$('hint').textContent='Hai passato. Il bot completa la giostra.';}
  else if(!mioTurno){$('hint').textContent='Tocca al bot…';}
  else if(selId){
    const c=v.mano.find(x=>x.id===selId);
    $('hint').textContent=`${nomeCarta(c)} — scegli lo spazio illuminato dove schierarla.`;
  }
  else $('hint').textContent='Tocca a te: scegli una carta, oppure passa.';

  if(mioTurno){
    const p=el('button','btn ghost','Passa');
    p.onclick=()=>{
      selId=null;
      if(RETE) return inviaAzione({t:'passa'});
      passa(G,ME);
      scrivi(`${nomeMio()}: passi. Non giocherai più carte in questa giostra.`,'me');
      dopoMossa();
    };
    az.appendChild(p);
    if(selId){
      const a=el('button','btn ghost','Annulla');
      a.onclick=()=>{selId=null;disegna();};
      az.appendChild(a);
    }
  }
}

function giocaIo(id,ruolo){
  if(RETE){ selId=null; inviaAzione({t:'gioca',id,ruolo}); return; }
  const c=G.v[ME].mano.find(x=>x.id===id);
  const ev=gioca(G,ME,id,ruolo);
  selId=null;
  if(G.attesa&&G.attesa.p===ME){          // La Staffetta: decidi tu
    scrivi(`Giochi <b>${nomeCarta(c)}</b>. Ora scegli l'effetto della Staffetta.`,'me');
    inScarto=false;disegna();return;
  }
  let t = ruolo==='giullare'
    ? `${nomeMio()}: giochi <b>${nomeCarta(c)}</b>.`
    : `${nomeMio()}: schieri una carta coperta come <b>${NOME_RUOLO[ruolo]}</b>.`;
  if(ev.eliminato)t+=` Il Guastafeste elimina lo Scudiero di ${nomeAv()}: era <b>${nomeCarta(ev.eliminato)}</b>.`;
  if(c.v===9&&!ev.eliminato&&ruolo==='giullare')t+=' Nessuno Scudiero da eliminare: colpo a vuoto.';
  scrivi(t,'me');
  diarioMossa(`0:${ruolo}:${id}`);
  if(ev.eliminato&&DIARIO&&DIARIO.g)DIARIO.g.eliminati++;
  dopoMossa();
}

function risolviMia(scelta){
  if(RETE){ inScarto=false; inviaAzione({t:'staffetta',scelta}); return; }
  const ev=risolviStaffetta(G,scelta);
  inScarto=false;
  if(ev.pescata)scrivi(`${nomeMio()}: con la Staffetta peschi.`,'me');
  else if(ev.scartata)scrivi(`${nomeMio()}: con la Staffetta scarti una carta.`,'me');
  else scrivi('La Staffetta resta in campo senza effetto.','me');
  if(DIARIO&&DIARIO.g){ if(ev.scartata)DIARIO.g.staffScarta++; else DIARIO.g.staffPesca++;
    diarioMossa(`0:staffetta:${ev.scartata?'scarta':'pesca'}`); }
  dopoMossa();
}

function dopoMossa(){
  disegna();
  if(G.fase==='applausi')return setTimeout(mostraApplausi,600);
  if(G.turno===BOT)setTimeout(turnoBot,720);
}

function turnoBot(){
  if(G.fase!=='giostra')return;
  if(G.turno!==BOT)return;
  const m=botMossa(G,LIV);
  if(m.tipo==='passa'){
    passa(G,BOT);scrivi(`${nomeAv()}: passa.`,'bot');
  }else{
    const c=G.v[BOT].mano.find(x=>x.id===m.id);
    const ev=gioca(G,BOT,m.id,m.ruolo);
    let t = m.ruolo==='giullare'
      ? `${nomeAv()}: gioca <b>${nomeCarta(c)}</b>.`
      : `${nomeAv()}: schiera una carta coperta come <b>${NOME_RUOLO[m.ruolo]}</b>.`;
    if(G.attesa&&G.attesa.p===BOT){
      const sc=sceltaStaffettaBot(G,BOT,LIV);
      const e2=risolviStaffetta(G,sc);
      if(e2.pescata)t+=' Con la Staffetta sceglie di pescare.';
      else if(e2.scartata)t+=' Con la Staffetta sceglie di scartare una carta.';
      else t+=' La Staffetta resta in campo senza effetto.';
      if(DIARIO&&DIARIO.g){ if(e2.scartata)DIARIO.g.staffScarta++; else DIARIO.g.staffPesca++; }
    }
    if(ev.eliminato)t+=` Il Guastafeste elimina il tuo Scudiero: era <b>${nomeCarta(ev.eliminato)}</b>.`;
    if(c.v===9&&!ev.eliminato&&m.ruolo==='giullare')t+=' Ma non c\'era nessuno Scudiero da eliminare.';
    scrivi(t,'bot');
    diarioMossa(`1:${m.ruolo}:${m.id}`);
    if(ev.eliminato&&DIARIO&&DIARIO.g)DIARIO.g.eliminati++;
  }
  disegna();
  if(G.fase==='applausi')return setTimeout(mostraApplausi,650);
  if(G.turno===BOT)setTimeout(turnoBot,720);
}

/* ---------- APPLAUSI ---------- */
function riga(et,a,b,vinc,nota){
  const w=i=>vinc===i?' win':'';
  return `<tr><td>${et}${nota?`<br><small style="opacity:.55">${nota}</small>`:''}</td>
    <td class="n${w(1)}">${b}</td><td class="n${w(0)}">${a}</td></tr>`;
}
function mostraApplausi(Rin){
  if(!Rin&&G.fase!=='applausi')return;   // già calcolata: non sommare due volte
  const R=Rin||applausi(G);
  if(!Rin)diarioApplausi(R);
  const A=G.v[ME],B=G.v[BOT],ac=G.assoCorrente,an=G.assoNemico;
  disegna();
  const fmtS=v=>v?`${v.base}${v.bonus?` +${v.bonus}`:''} = <b>${v.tot}</b>`:'—';
  const fmtC=v=>v?`${v.base}${v.bonusAsso?' +1':''}${v.equip?` +${v.equip}`:''} = <b>${v.tot}</b> (dist. ${v.dist})`:'—';
  const fmtI=v=>{
    if(!v.giullari)return '—';
    const p=[`${v.giullari} giullar${v.giullari>1?'i':'e'}`,
      `${v.dieci}×${v.giullari-1} = ${v.capocomico}`];
    if(v.nemici)p.push(`+${v.nemici} di ${NOME_SEME[an.s]}`);
    return `<small style="opacity:.62">${p.join(' · ')}</small> = <b>${v.tot}</b>`;
  };
  const campo=(v,lab)=>{
    const k=v.campo,c=[];
    if(k.cav)c.push(k.cav);if(k.equ)c.push(k.equ);if(k.scu)c.push(k.scu);
    c.push(...k.giullari);
    return `<div class="lato"><span>${lab}</span><div class="fila">${
      c.length?c.map(x=>`<div class="card sm" style="background-position:${(x.v-1)*(100/9)}% ${SEMI.indexOf(x.s)*(100/3)}%"></div>`).join('')
      :'<div style="opacity:.4;font-size:13px;padding:20px 0">campo vuoto</div>'}</div></div>`;
  };
  let sp='';
  if(R.cavalieri.spareggio)
    sp=`spareggio sui ${NOME_SEME[ac.s]}: ${R.cavalieri.spareggio.b} contro ${R.cavalieri.spareggio.a}`;

  ov.hidden=false;ov.classList.add('laterale');panel.className='panel applausi';
  panel.innerHTML=`
    <h2>Gli Applausi — Giostra ${G.giostra}</h2>
    <div class="rivela">${campo(B,nomeAv())}${campo(A,nomeMio())}</div>
    <table class="tab">
      <tr><th>Castello di ${NOME_SEME[ac.s]} · vicino ${NOME_SEME[an.s]}</th><th style="text-align:right">${nomeAv()}</th><th style="text-align:right">${nomeMio()}</th></tr>
      ${riga('Scudiero',fmtS(R.scudieri.a),fmtS(R.scudieri.b),R.scudieri.vincitore)}
      ${riga(`<i>Il migliore degli Scudieri</i> +${PF_SCU}`,
        R.scudieri.vincitore===0?`+${PF_SCU}`:'—',R.scudieri.vincitore===1?`+${PF_SCU}`:'—',R.scudieri.vincitore)}
      ${riga('Cavaliere',fmtC(R.cavalieri.a),fmtC(R.cavalieri.b),R.cavalieri.vincitore)}
      ${riga(`<i>La giostra dei Cavalieri</i> +${PF_CAV}`,
        R.cavalieri.vincitore===0?`+${PF_CAV}`:'—',R.cavalieri.vincitore===1?`+${PF_CAV}`:'—',
        R.cavalieri.vincitore,sp)}
      ${riga('<i>L\'Istrione del Regno</i>',fmtI(R.istrione.a),fmtI(R.istrione.b),
        R.istrione.a.tot>R.istrione.b.tot?0:R.istrione.b.tot>R.istrione.a.tot?1:null,
        `ogni 10 vale gli altri giullari del proprio campo, più i giullari di ${NOME_SEME[an.s]}`)}
      ${G.giostra===3?riga('Carte in mano a fine viaggio',`−${R.mano[0]}`,`−${R.mano[1]}`,null):''}
      <tr class="tot"><td>Punti Favore della giostra</td>
        <td class="n">${R.pf[1]>=0?'+':''}${R.pf[1]}</td>
        <td class="n">${R.pf[0]>=0?'+':''}${R.pf[0]}</td></tr>
      <tr class="tot"><td>Totale del viaggio</td>
        <td class="n${B.pf>A.pf?' win':''}">${B.pf}</td>
        <td class="n${A.pf>B.pf?' win':''}">${A.pf}</td></tr>
    </table>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      ${(RETE&&RETE.p!==0&&G.giostra<3)
        ? `<span style="font-size:13px;opacity:.7">In attesa che l'altro viandante prosegua…</span>`
        : `<button class="btn" id="avanti">${G.giostra<3?'Prosegui il viaggio':'La fine del viaggio'}</button>`}
    </div>`;
  scrivi(`<b>Applausi della giostra ${G.giostra}</b>: ${nomeMio()} ${R.pf[0]>=0?'+':''}${R.pf[0]}, `+
    `${nomeAv()} ${R.pf[1]>=0?'+':''}${R.pf[1]}. Totali ${A.pf} a ${B.pf}.`,'sys');
  if($('avanti')) $('avanti').onclick=()=>{
    if(RETE){
      if(G.giostra>=3) return fineViaggio();     // la fine del viaggio si mostra qui
      $('avanti').disabled=true;
      $('avanti').textContent='Si riparte…';
      return inviaAzione({t:'avanti'}); }
    if(G.giostra<3){chiudiGiostra(G);ov.hidden=true;partiGiostra();}
    else fineViaggio();
  };
}

function fineViaggio(){
  archivia();
  ov.classList.remove('laterale');panel.className='panel';
  const A=G.v[ME],B=G.v[BOT];
  const vinco=A.pf>B.pf, pari=A.pf===B.pf;
  panel.innerHTML=`
    <h2>${pari?'Il Castello dell\'Ultimo Asso':vinco?'Sei il Buffone del Regno':'Il bot è il Buffone del Regno'}</h2>
    <p style="font-size:16px">Punti Favore finali — <b>tu ${A.pf}</b>, bot ${B.pf}.</p>
    <p>${pari
      ? 'Ci si ubriaca tutti, si fa baldoria e ci si abbraccia. Poi, prima di andare a dormire, da una delle Carovane si alza una voce: «Il viaggio è la parte più importante, non la meta.»'
      : vinco
        ? 'Le Signore degli Assi hanno riso alle tue giostre. La carovana riparte, e con essa la tua fama.'
        : 'Le Signore hanno preferito l\'altro viandante. Ci sarà un\'altra carovana, un altro Regno.'}</p>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn ghost" id="ancora">Un altro viaggio</button>
      <button class="btn" id="nuovo">Torna al menu</button>
    </div>`;
  $('ancora').onclick=()=>{
    if(RETE){try{RETE.ws.close()}catch(e){};RETE=null;location.hash='';}
    ov.hidden=true;avvia();};
  $('nuovo').onclick=()=>{
    if(RETE){try{RETE.ws.close()}catch(e){};RETE=null;}
    location.hash='';G=null;$('app').hidden=true;schermataIniziale();};
}

if(!daIndirizzo()) schermataIniziale();
</script>
